apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ragtool-agent
  namespace: "237915647765"
  selfLink: /apis/serving.knative.dev/v1/namespaces/237915647765/services/ragtool-agent
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "10"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3000
      containers:
        - name: ragtool-agent-1
          image: europe-west1-docker.pkg.dev/ivaconsulta/ragtool/ragtool-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GEMINI_2.0_FLASH
              value: GEMINI_2.0FLASH
            - name: GEMINI_2.5_FLASH
              value: GEMINI_2.5FLASH
            - name: GROQ_LLAMA__LIGHT_MODEL
              value: GROQ_LLAMA__LIGHT_MODEL
            - name: GROQ_LLAMA_MODEL
              value: GROQ_LLAMA_MODEL
            - name: GROQ_MIXTRAL_MODEL
              value: GROQ_MIXTRAL_MODEL
            - name: OPENAI_4o_MINI
              value: OPENAI_4o_MINI
            - name: CONFIG_SET
              value: GEMINI_2.5_FLASH
            - name: LANGSMITH_PROJECT
              value: rag-ivaconsulta-dev
            - name: AGENT_ROLE
              value: VAT_AGENT
            - name: RAG_DATA_PATH
              value: ./data/raw
            - name: CHROMA_DB_PATH
              value: ./db
            - name: VAT_AGENT
              value: VAT_AGENT
            - name: SAP_AGENT
              value: SAP_AGENT
            - name: AGENT_ROLE
              value: VAT_AGENT
            - name: CREWAI_TRACING_ENABLED
              value: "true"
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: OPENAI_API_KEY
            - name: EMBEDDINGS_GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: EMBEDDINGS_GOOGLE_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GOOGLE_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GEMINI_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GROQ_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: LANGSMITH_API_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: API_KEY
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            tcpSocket:
              port: 8080
  traffic:
    - percent: 100
      latestRevision: true
