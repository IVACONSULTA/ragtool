[tool:pytest]
# Pytest configuration for SapRagTool
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
collect_ignore = test_runner.py run_tests.py

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    compliance: Compliance tests
    slow: Slow running tests
    requires_server: Tests that require a running server

# Test timeout (in seconds)
timeout = 300

# Minimum version
minversion = 6.0
