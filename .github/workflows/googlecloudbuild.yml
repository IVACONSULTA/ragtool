name: Build and Push Docker Image to Artifact Registry

on:
  push:
    branches:
      - main # Trigger this workflow on pushes to the 'main' branch
      - feat/google-cloud
  workflow_dispatch: # Allows manual triggering of the workflow

env:
  PROJECT_ID: ivaconsulta # Your GCP project ID
  GAR_LOCATION: europe-west1 # Region of your Artifact Registry
  REPOSITORY: ragtool # Your Artifact Registry Docker repository name
  IMAGE_NAME: ragtool-agent # Name for your Docker image (e.g., my-python-app)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v2
        with:
          username: _json_key
          password: '${{ secrets.GCP_SA_KEY }}'
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
